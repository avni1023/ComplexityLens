family_idea: "In-place selection sort performing repeated nested minimum scans."
label: "ON2"
label_rationale: "Selection sort makes n passes over the array; the i-th pass scans n - i - 1 remaining elements to identify the minimum. Across all passes it performs sum_{i=0}^{n-1} (n - i - 1) = n(n - 1) / 2 comparisons, yielding strictly O(n^2) worst-case time complexity regardless of initial ordering."
tag: "easy"
expected_parse: "valid"
origin: "hand_written"
label_status: "author_labeled"
verified: false
