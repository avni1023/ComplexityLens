family_idea: "Linear outer loop of size n containing an inner logarithmic halving or doubling loop."
label: "ONLOGN"
label_rationale: "The outer loop executes n iterations; for each iteration, the inner loop halves or doubles its control variable across [1, n], taking floor(log2(n)) steps. The product n * log2(n) yields strictly O(n log n) worst-case time complexity."
