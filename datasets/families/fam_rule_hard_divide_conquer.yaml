family_idea: "Merge-sort style divide-and-conquer recursion over ranges with linear merge step."
label: "ONLOGN"
label_rationale: "Recurrence T(n) = 2T(n/2) + O(n) divides problem in half at each step with linear work per level, resolving to O(n log n) by the Master theorem."
tag: "rule_hard"
expected_parse: "valid"
