  - "f40_triple_sum_while"
  - "f40_triple_sum_helper"
assumptions:
  - "n is the size of the input array/vector (SINGLE_INPUT_SYMBOL)."
  - "Triple-nested scan visits distinct index triples (i < j < k)."
  - "Each triple comparison is O(1); total worst-case work is Theta(n^3)."
