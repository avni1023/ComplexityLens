family_idea: "Triple nested loop checking whether any three distinct elements sum to a target."
label: "ON3"
label_rationale: "Three nested loops over a container of size n. Outer loop runs n times, middle runs up to n, inner runs up to n. Summing distinct triples takes n*(n-1)*(n-2)/6 operations in the worst case, which is Theta(n^3) = ON3."
tag: "easy"
expected_parse: "valid"
origin: "hand_written"
label_status: "author_labeled"
verified: false
programs:
